# EXAMPLE FOR THE PILOT. Copy to .github/workflows/delivery-session.yml in the PROJECT repo (not this
# one), read every line, and adapt it. It has not been run against your repository.
#
# What it does: someone runs it by hand (workflow_dispatch) with a session name and the wave branch
# the owner already created (`wave/<closing key>-<wave-name>`). It checks out that branch, runs the
# delivery plugin's run-session skill headless with Claude Code, commits whatever the session STAGED
# as the session's one commit on the wave branch, pushes the branch, and opens the wave's draft pull
# request if it has none yet. It never creates a branch: one branch, one push target and one pull
# request per wave. Claude never commits or pushes: the plugin's git guard blocks it. The workflow
# commits on the owner's behalf only to the wave branch, and the wave's pull request is the owner's
# approval step. Nothing merges automatically.
#
# Never point this at production. The runner gets staging configuration and synthetic test
# accounts only; production secrets must not exist in this repository's Actions secrets.
#
# Secrets (Settings → Secrets and variables → Actions). Placeholders only; never commit values:
#   ANTHROPIC_API_KEY        Claude API key (or use CLAUDE_CODE_OAUTH_TOKEN with the
#                            claude_code_oauth_token input instead)
#   JIRA_SITE, JIRA_USER, JIRA_TOKEN   optional; without them the session records Jira as NOT RUN
#   STAGING_*                optional; staging-only settings your integration tests need
#
# Inputs are validated against strict patterns before use and are never interpolated into a shell
# command; they reach the shell only as quoted environment variables.

name: delivery-session

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Session name from SESSIONS.md (e.g. labels-domain), or a ticket key for a small change"
        required: true
      ticket_key:
        description: "The session's tracker key (e.g. ABC-42); used for the commit subject"
        required: true
      wave_branch:
        description: "The existing wave branch (e.g. wave/ABC-50-labels); the session commits to it"
        required: true

concurrency:
  # One session at a time per wave: sessions in a wave share its branch.
  group: delivery-session-${{ github.event.inputs.wave_branch }}
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Least privilege for this job: push the wave branch, open its PR.
    # id-token: write is required by claude-code-action's default GitHub App authentication.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      IN_SESSION: ${{ github.event.inputs.session }}
      IN_KEY: ${{ github.event.inputs.ticket_key }}
      IN_BRANCH: ${{ github.event.inputs.wave_branch }}
    steps:
      - name: Validate the session name, ticket key and wave branch
        id: ids
        run: |
          set -eu
          printf '%s' "$IN_SESSION" | grep -qE '^[A-Za-z][A-Za-z0-9-]{0,47}$' || { echo "bad session name"; exit 1; }
          printf '%s' "$IN_KEY" | grep -qE '^[A-Z][A-Z0-9]+-[0-9]+$' || { echo "bad ticket key"; exit 1; }
          printf '%s' "$IN_BRANCH" | grep -qE '^wave/[A-Z][A-Z0-9]+-[0-9]+-[a-z0-9][a-z0-9-]{0,47}$' || { echo "bad wave branch"; exit 1; }
          echo "session=$IN_SESSION" >> "$GITHUB_OUTPUT"
          echo "key=$IN_KEY" >> "$GITHUB_OUTPUT"
          echo "branch=$IN_BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ids.outputs.branch }}
          fetch-depth: 0

      - name: Run the session headless
        uses: anthropics/claude-code-action@v1
        env:
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/arunma/delivery-framework.git"
          plugins: "delivery@delivery-framework"
          prompt: "/delivery:session ${{ steps.ids.outputs.session }} --ci"
          # Adapt the allowed tools to the project's test, lint and build commands. git commit and
          # git push are blocked by the plugin's git guard regardless.
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git status*),Bash(git diff*),Bash(git add*),Bash(python3 *),Bash(graphify *),Bash(make *),Bash(npm test*),Bash(pytest*)"

      - name: Commit the session to the wave branch and open the wave's pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.ids.outputs.session }}
          KEY: ${{ steps.ids.outputs.key }}
          BRANCH: ${{ steps.ids.outputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if git diff --cached --quiet; then
            echo "The session staged nothing; nothing to commit." ; exit 0
          fi
          git config user.name "delivery-session-bot"
          git config user.email "delivery-session-bot@users.noreply.github.com"
          git commit -m "$KEY: $SESSION (staged by the delivery session; review before merge)"
          git push origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --draft --base "$BASE" --head "$BRANCH" \
              --title "$BRANCH" \
              --body "Draft opened by the delivery-session workflow (pilot) for the whole wave. Each session is one commit; the session reports are in the workflow run logs. A person reviews the evidence, the verification files and the diff, and marks it ready after the wave's close."
          fi
